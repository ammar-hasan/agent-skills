name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python scripts/validate_skills.py
      - name: Check skill version increases
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REVISION" ] && [ "$BASE_REVISION" != "0000000000000000000000000000000000000000" ]; then
            python scripts/validate_skills.py --base "$BASE_REVISION"
          fi
      - run: python scripts/check_public_content.py
      - run: python -m unittest discover -s tests -v
      - name: Test promoted Python helpers
        run: |
          for directory in skills/*/tests; do
            if [ -d "$directory" ]; then
              python -m unittest discover -s "$directory" -v
            fi
          done
  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
